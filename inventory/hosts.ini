# Duchess DevOps Sample Ansible Inventory
# Enroll servers by adding host entries under groups below.
# Both INI (hosts.ini) and YAML (hosts.yml) formats are supported by `duchess`.
#
# Tip: Leave ansible_user omitted to specify the SSH user at launch
# (or pass `-u <user>` to `duchess`), or pin a per-host user like:
#   prod-app-01 ansible_host=127.0.0.1 ansible_user=ubuntu ansible_port=22

[production]
prod-app-01 ansible_host=127.0.0.1 ansible_port=22

[webservers]
prod-app-01 ansible_host=127.0.0.1

[docker_hosts]
prod-app-01 ansible_host=127.0.0.1

[all:vars]
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args='-o StrictHostKeyChecking=accept-new -o ConnectTimeout=10'
# Uncomment to set a default SSH user or key across all enrolled hosts:
# ansible_user=ubuntu
# ansible_ssh_private_key_file=~/.ssh/id_ed25519
