# Sample Ansible YAML inventory (alternative to hosts.ini)
all:
  vars:
    ansible_python_interpreter: /usr/bin/python3
    ansible_ssh_common_args: "-o StrictHostKeyChecking=accept-new -o ConnectTimeout=10"
  children:
    production:
      hosts:
        prod-app-01:
          ansible_host: 127.0.0.1
          ansible_port: 22
    webservers:
      hosts:
        prod-app-01:
          ansible_host: 127.0.0.1
    docker_hosts:
      hosts:
        prod-app-01:
          ansible_host: 127.0.0.1
