---
# duchess:name: Restart Service
# duchess:description: Safely restarts a target systemd service and verifies it returns to active state.
# duchess:category: operations
# duchess:vars: service_name=nginx
- name: Restart Target Service
  hosts: all
  become: true
  vars:
    service_name: nginx
  tasks:
    - name: Restart {{ service_name }}
      ansible.builtin.systemd:
        name: "{{ service_name }}"
        state: restarted
        daemon_reload: true

    - name: Verify {{ service_name }} is active
      ansible.builtin.command: "systemctl is-active {{ service_name }}"
      register: svc_status
      changed_when: false

    - name: Show service status
      ansible.builtin.debug:
        msg: "{{ service_name }} status on {{ inventory_hostname }}: {{ svc_status.stdout }}"
