---
# duchess:name: Deploy libretrac.site
# duchess:description: Build locally and deploy libretrac.site (Flutter Web), then reload Nginx
# duchess:category: site-deploy
# duchess:vars: build=true

- name: Deploy libretrac.site
  hosts: "{{ target_hosts | default('all') }}"
  become: yes
  vars_files:
    - "group_vars/all/vars.yml"
  vars:
    build: true
    target_site: "libretrac"

  roles:
    - role: static_sites

  post_tasks:
    - name: Reload Nginx
      service:
        name: nginx
        state: reloaded
      when: selected_static_sites | default([]) | length > 0
